services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [SpotTheDifference]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8002:8001"]
    environment:
      PORT: 8001
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      QUEUE_NAME: "-SpotTheDifference:inference"
      DATABASE_PATH: /app/data/-SpotTheDifference.sqlite
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MAX_FILE_SIZE_BYTES: 10485760
      INFERENCE_API_URL: http://inference:8010
    volumes: [SpotTheDifference-data:/app/data]
    depends_on:
      redis:
        condition: service_healthy
    networks: [SpotTheDifference]

  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports: ["8010:8011"]
    environment:
      MODEL_PATH: /app/models/model-placeholder.pt
      REDIS_URL: redis://redis:6379
      INFERENCE_API_URL: http://inference:8010/api/v1/analyze
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/-SpotTheDifference.sqlite
      QUEUE_NAME: "-SpotTheDifference:inference"
      PYTHONPATH: /app
    volumes: [SpotTheDifference-data:/app/data]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [SpotTheDifference]

  worker:
    build:
      context: .
      dockerfile: inference/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/-SpotTheDifference.sqlite
      QUEUE_NAME: "-SpotTheDifference:inference"
      INFERENCE_API_URL: http://inference:8010/api/v1/analyze
      PYTHONPATH: /app
    volumes: [SpotTheDifference-data:/app/data]
    depends_on:
      redis:
        condition: service_healthy
      inference:
        condition: service_started
    entrypoint: ["python", "inference/worker.py"]
    networks: [SpotTheDifference]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:5172"]
    environment:
      VITE_API_BASE_URL: http://localhost:8002
    depends_on:
      backend:
        condition: service_started
    networks: [SpotTheDifference]

volumes:
  SpotTheDifference-data:
  redis-data:

networks:
  SpotTheDifference:
    driver: bridge
